async function checkAuth() {

  if (hash.includes('type=recovery')) {

let DATA = [];
let active = null;
const mkrs = {}, lines = {};
const BASE = { lat: 43.2956, lon: -2.9921 };

/* ── Utilidades geográficas (mismo modelo que planning.js) ── */
function haversineB(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function walkMinB(lat1, lon1, lat2, lon2) {
  return Math.max(1, Math.ceil((haversineB(lat1,lon1,lat2,lon2)*1000*1.4/1000/4)*60));
}
function driveMinB(lat1, lon1, lat2, lon2) {
  const d = haversineB(lat1,lon1,lat2,lon2);
  const [tor,kph] = d<1?[1.7,15]:d<4?[1.5,25]:d<12?[1.4,42]:d<30?[1.3,65]:[1.2,80];
  return Math.max(1, Math.ceil(d*tor/kph*60));
}
/* Calcula vuelta a base rastreando dónde quedó el coche.
   Devuelve { walk, drive, total } */
function calcRetBase(clients) {
  if (!clients || !clients.length) return { walk: 0, drive: 0, total: 0 };
  let carLat = BASE.lat, carLon = BASE.lon;
  let lastLat = BASE.lat, lastLon = BASE.lon;
  for (const c of clients) {
    if (!c.andando) { carLat = c.lat; carLon = c.lon; }
    lastLat = c.lat; lastLon = c.lon;
  }
  const mismo = Math.abs(lastLat-carLat)<1e-5 && Math.abs(lastLon-carLon)<1e-5;
  const walk  = mismo ? 0 : walkMinB(lastLat, lastLon, carLat, carLon);
  const drive = driveMinB(carLat, carLon, BASE.lat, BASE.lon);
  return { walk, drive, total: walk + drive };
}

const map = L.map('map').setView([BASE.lat, BASE.lon], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap contributors' }).addTo(map);

L.marker([BASE.lat, BASE.lon], { icon: L.divIcon({
  html: '<div style="background:#1a56db;color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 7px rgba(0,0,0,.4)">🏢</div>',
  iconSize: [34, 34], iconAnchor: [17, 17], className: ''
}) }).addTo(map).bindPopup('<b>BilboWeb — Base</b><br>Barakaldo');

async function init() {
  try {
    const { data: rows, error } = await sb
      .from('planning_schedule')
      .select('schedule')
      .order('id', { ascending: false })
      .limit(1);
    if (error) throw new Error(error.message);
    const schedule = rows?.[0]?.schedule || {};
    DATA = (schedule.dias || []).map(d => {
      const clients = (d.clientes || []).map(c => ({ ...c }));
      const rb      = calcRetBase(clients);
      // retBase total: usar el de Supabase si existe, si no el calculado aquí
      // retWalk / retDrive siempre los calculamos aquí para mostrar desglose
      return {
        date:      d.fecha,
        dateLabel: d.label,
        totalMin:  d.totalMin,
        color:     d.color,
        retBase:   d.retBase || rb.total,
        retWalk:   rb.walk,
        retDrive:  rb.drive,
        clients
      };
    });
    document.getElementById('st-dias').textContent    = DATA.length;
    document.getElementById('st-visitas').textContent = DATA.reduce((s, d) => s + d.clients.length, 0);
    document.querySelector('#hdr p').textContent =
      'Desde Barakaldo · ' + DATA.reduce((s, d) => s + d.clients.length, 0) + ' clientes · ' + DATA.length + ' días laborables';

    const weeks = new Set(DATA.map(d => {
      if (!d.date) return 'x';
      const dt = new Date(d.date), j = new Date(dt.getFullYear(), 0, 1);
      return Math.ceil(((dt - j) / 864e5 + j.getDay() + 1) / 7) + '-' + dt.getFullYear();
    }));
    document.getElementById('wkCount').textContent = weeks.size;

    /* Jitter para coords duplicadas */
    (function () {
      const seen = {};
      DATA.forEach(day => {
        day.clients.forEach(c => {
          if (!c.lat || !c.lon) return;
          const key = c.lat.toFixed(3) + ',' + c.lon.toFixed(3);
          if (!seen[key]) seen[key] = 0;
          const idx = seen[key]++;
          if (idx > 0) {
            const angle = idx * 2.39996;
            const r = 0.0007 * Math.ceil(Math.sqrt(idx));
            c.lat = parseFloat((c.lat + r * Math.sin(angle)).toFixed(6));
            c.lon = parseFloat((c.lon + r * Math.cos(angle)).toFixed(6));
          }
        });
      });
    })();

    // Sobreescribir estado con el valor en tiempo real de la tabla notas
    try {
      const { data: notasVivas } = await sb.from('notas').select('cliente_id,estado');
      if (notasVivas && notasVivas.length) {
        const notasMap = {};
        notasVivas.forEach(n => { if (n.cliente_id) notasMap[n.cliente_id] = n.estado; });
        DATA.forEach(day => {
          day.clients.forEach(c => {
            if (c.id && notasMap[c.id] !== undefined) c.estado = notasMap[c.id];
          });
        });
      }
    } catch(e) { /* silencioso — si falla, usa el snapshot del planning */ }

    buildMarkers();
    buildSidebar();
  } catch (e) {
    document.getElementById('hdr').innerHTML += `<p style="color:#fca5a5;margin-top:6px">Error: ${e.message}</p>`;
  }
}

function buildMarkers() {
  DATA.forEach((day, di) => {
    mkrs[di] = [];
    const pts = [[BASE.lat, BASE.lon]];

    day.clients.forEach((c, ci) => {
      if (!c.lat || !c.lon) return;
      const m = L.marker([c.lat, c.lon], { icon: L.divIcon({
        html: `<div style="background:${day.color};color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.35)">${c.order}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13], className: ''
      }), opacity: .85 }).addTo(map);
      m.bindPopup(`<b>${c.nombre}</b><br><small>${c.direccion}<br>${c.poblacion} ${c.cp}</small><br>🕐 ${c.llegada} – ${c.salida}<br><a href="/notas?id=${c.id}" class="nota-btn" style="margin-top:6px">📝 Abrir nota</a>`);
      m.on('click', () => { openDay(di, true); focusClient(di, ci); });
      mkrs[di].push(m);
      pts.push([c.lat, c.lon]);
    });

    pts.push([BASE.lat, BASE.lon]);
    lines[di] = L.polyline(pts, { color: day.color, weight: 2.5, opacity: .38, dashArray: '7,5' }).addTo(map);
  });
}

function buildSidebar() {
  const cal = document.getElementById('cal');
  cal.innerHTML = '';

  DATA.forEach((day, di) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'c' + di;

    // Municipios más frecuentes del día (máx. 2)
    const munCount = {};
    day.clients.forEach(c => { if (c.poblacion) munCount[c.poblacion] = (munCount[c.poblacion] || 0) + 1; });
    const munLabel = Object.entries(munCount).sort((a,b) => b[1]-a[1]).slice(0,2).map(([m]) => m).join(' · ');

    const h = document.createElement('div');
    h.className = 'card-hdr';
    h.style.background = day.color;
    h.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
        <span>📅 ${day.dateLabel}</span>
        ${munLabel ? `<span style="font-size:10px;opacity:.75;font-weight:500;letter-spacing:.2px">${munLabel}</span>` : ''}
      </div>
      <span class="badge" style="flex-shrink:0">${day.clients.length} visitas · ${(day.totalMin / 60).toFixed(1)}h</span>`;
    h.onclick = () => toggleDay(di);

    const body = document.createElement('div');
    body.className = 'card-body';

    const ESTADO_BADGE = {
      'realizada':     '<span style="font-size:9px;background:#d1fae5;color:#065f46;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:5px;vertical-align:middle">🟢 Realizada</span>',
      'pospuesta':     '<span style="font-size:9px;background:#fef3c7;color:#d97706;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:5px;vertical-align:middle">🟠 Pospuesta</span>',
      'no-interesado': '<span style="font-size:9px;background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:5px;vertical-align:middle">🔴 No interesado</span>',
    };

    day.clients.forEach((c, ci) => {
      const row = document.createElement('div');
      row.className = 'cli-row';
      row.innerHTML = `
        <div class="cli-num" style="background:${day.color}">${c.order}</div>
        <div class="cli-info">
          <div class="cli-name">${c.nombre}${ESTADO_BADGE[c.estado] || ''}</div>
          <div class="cli-sub">${c.poblacion}${c.cp ? ' · ' + c.cp : ''}</div>
          <div class="cli-drv">${c.andando
            ? `🚶 ${c.travel} min andando`
            : `${c.returnToCarMin > 0 ? `🚶 ${c.returnToCarMin}' al coche + ` : ''}${c.travel > 0 ? `🚗 ${c.travel} min` : '🚗 &lt;1 min'}`}</div>
        </div>
        <div class="cli-time">
          <div class="arr">${c.llegada}</div>
          <div class="dep">${c.salida}</div>
        </div>
        ${c.id ? `<a class="nota-btn" href="/notas?id=${c.id}" onclick="event.stopPropagation()">📝</a>` : ''}`;
      row.onclick = e => { e.stopPropagation(); focusClient(di, ci); };
      body.appendChild(row);
    });

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const retLabel = day.retWalk > 0
      ? `🚶 ${day.retWalk}' + 🚗 ${day.retDrive}' vuelta a base`
      : `🚗 ${day.retDrive} min vuelta a base`;
    foot.innerHTML = `<span>⏱ Total: ${(day.totalMin / 60).toFixed(1)} h</span>
      <span>${retLabel}</span>`;
    body.appendChild(foot);

    card.appendChild(h);
    card.appendChild(body);
    cal.appendChild(card);
  });
}

function toggleDay(di, force) {
  const card = document.getElementById('c' + di);
  const wasOpen = card.classList.contains('open');
  if (active !== null) closeDay(active);
  if (!wasOpen || force) openDay(di);
}

function openDay(di, keepClosed) {
  if (keepClosed) return;
  const card = document.getElementById('c' + di);
  card.classList.add('open');
  active = di;
  if (lines[di]) lines[di].setStyle({ opacity: .9, weight: 4.5 });
  mkrs[di]?.forEach(m => m.setOpacity(1));
  DATA.forEach((_, k) => {
    if (k !== di) {
      if (lines[k]) lines[k].setStyle({ opacity: .12, weight: 1.5 });
      mkrs[k]?.forEach(m => m.setOpacity(.28));
    }
  });
  const pts = DATA[di].clients.filter(c => c.lat && c.lon).map(c => [c.lat, c.lon]);
  if (pts.length) map.fitBounds([[BASE.lat, BASE.lon], ...pts], { padding: [50, 50] });
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDay(di) {
  document.getElementById('c' + di)?.classList.remove('open');
  active = null;
  DATA.forEach((_, k) => {
    if (lines[k]) lines[k].setStyle({ opacity: .38, weight: 2.5 });
    mkrs[k]?.forEach(m => m.setOpacity(.85));
  });
}

function focusClient(di, ci) {
  const c = DATA[di].clients[ci];
  if (c.lat && c.lon) {
    map.setView([c.lat, c.lon], 15);
    mkrs[di]?.[ci]?.openPopup();
  }
}

function filter() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  let shown = 0;
  DATA.forEach((day, di) => {
    const card = document.getElementById('c' + di);
    const hit = !q || day.dateLabel.toLowerCase().includes(q) ||
      day.clients.some(c => c.nombre.toLowerCase().includes(q) ||
                            c.poblacion.toLowerCase().includes(q));
    card.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  let nr = document.getElementById('nores');
  if (!shown && q) {
    if (!nr) { nr = document.createElement('div'); nr.id = 'nores'; nr.className = 'nores'; document.getElementById('cal').appendChild(nr); }
    nr.textContent = 'Sin resultados para "' + q + '"';
  } else if (nr) nr.remove();
}

async function downloadExcelCompleto() {
  const btnFull = document.getElementById('btn-xls-full');
  const orig = btnFull ? btnFull.textContent : '';
  if (btnFull) { btnFull.textContent = '⏳ Cargando…'; btnFull.disabled = true; }

  try {
    // Cargar clientes y notas directamente de Supabase (sin pasar por planning)
    const [{ data: clientes, error: errCli }, { data: notasArr }] = await Promise.all([
      sb.from('clientes').select('id,nombre,direccion,poblacion,cp').eq('activo', true).order('nombre'),
      sb.from('notas').select('*')
    ]);
    if (errCli) throw new Error(errCli.message);

    const notasMap = {};
    (notasArr || []).forEach(n => { notasMap[n.cliente_id] = n; });

    // Ordenar: realizadas → pospuestas → no-interesadas → pendientes; luego alfabético
    const ORDEN = { realizada: 0, pospuesta: 1, 'no-interesado': 2, pendiente: 3 };
    (clientes || []).sort((a, b) => {
      const oa = ORDEN[notasMap[a.id]?.estado || 'pendiente'] ?? 3;
      const ob = ORDEN[notasMap[b.id]?.estado || 'pendiente'] ?? 3;
      return oa !== ob ? oa - ob : a.nombre.localeCompare(b.nombre, 'es');
    });

    // ── Colores y helpers ExcelJS ──────────────────────────────
    const AZUL   = 'FF1A56DB';
    const BLANCO = 'FFFFFFFF';
    const ESTADO_ARGB = {
      realizada:      'FFD1FAE5',
      pospuesta:      'FFFEF3C7',
      'no-interesado':'FFFEE2E2',
    };
    const ESTADO_ES = {
      pendiente:      '⚪ Pendiente',
      realizada:      '🟢 Realizada',
      pospuesta:      '🟠 Pospuesta',
      'no-interesado':'🔴 No interesado',
    };

    function hdrStyle(cell) {
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: AZUL } };
      cell.font = { bold:true, color:{ argb: BLANCO }, size:10 };
      cell.alignment = { vertical:'middle' };
    }
    function estadoStyle(cell, estado) {
      const argb = ESTADO_ARGB[estado];
      if (argb) cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb } };
      cell.font = { bold: true };
    }

    const wb = new ExcelJS.Workbook();
    wb.creator = 'BilboWeb Planning';
    wb.created = new Date();

    // ── Pestaña Actividad Comercial ────────────────────────────
    const wsAC = wb.addWorksheet('Actividad Comercial');
    wsAC.views = [{ state:'frozen', ySplit:1 }];
    wsAC.columns = [
      { header:'Empresa',          key:'nombre',      width:38 },
      { header:'Municipio',        key:'poblacion',   width:16 },
      { header:'CP',               key:'cp',          width:8  },
      { header:'Estado',           key:'estado',      width:18 },
      { header:'Fecha visita',     key:'fvisita',     width:13 },
      { header:'Interlocutor',     key:'interlocut',  width:26 },
      { header:'Interés (1-5)',    key:'interes',     width:11 },
      { header:'Problema / Dolor', key:'dolor',       width:34 },
      { header:'Servicios',        key:'servicios',   width:30 },
      { header:'Próximo paso',     key:'proximopaso', width:30 },
      { header:'Seguimiento',      key:'seguimiento', width:13 },
      { header:'Notas libres',     key:'texto',       width:40 },
      { header:'Actualizado',      key:'actualizado', width:13 },
    ];

    // Estilo cabecera
    wsAC.getRow(1).eachCell(c => hdrStyle(c));
    wsAC.getRow(1).height = 20;
    wsAC.autoFilter = { from: 'A1', to: 'M1' };

    (clientes || []).forEach(c => {
      const n        = notasMap[c.id] || {};
      const estado   = n.estado || 'pendiente';
      let servicios  = '';
      try { servicios = Array.isArray(n.servicios) ? n.servicios.join(' | ') : JSON.parse(n.servicios || '[]').join(' | '); } catch(e) {}

      const row = wsAC.addRow({
        nombre:      c.nombre,
        poblacion:   c.poblacion,
        cp:          c.cp,
        estado:      ESTADO_ES[estado] || '⚪ Pendiente',
        fvisita:     n.fecha_visita || '',
        interlocut:  n.interlocutor || '',
        interes:     n.interes || '',
        dolor:       (n.dolor        || '').replace(/\n/g,' '),
        servicios,
        proximopaso: (n.proximo_paso || '').replace(/\n/g,' '),
        seguimiento: n.fecha_seguimiento || '',
        texto:       (n.texto         || '').replace(/\n/g,' '),
        actualizado: n.actualizado_en ? new Date(n.actualizado_en).toLocaleDateString('es-ES') : '',
      });

      row.eachCell(cell => { cell.alignment = { vertical:'middle', wrapText: false }; });
      estadoStyle(row.getCell('estado'), estado);
    });

    // ── Pestaña Resumen ────────────────────────────────────────
    const wsRes = wb.addWorksheet('Resumen');
    wsRes.columns = [{ width:22 }, { width:14 }, { width:12 }];

    const total = (clientes || []).length;
    const cnt   = { realizada:0, pospuesta:0, 'no-interesado':0, pendiente:0 };
    (clientes || []).forEach(c => {
      const e = notasMap[c.id]?.estado || 'pendiente';
      cnt[e] !== undefined ? cnt[e]++ : cnt.pendiente++;
    });
    const pct = n => total ? ((n / total) * 100).toFixed(1) + '%' : '0%';

    const titleRow = wsRes.addRow(['Resumen de actividad comercial']);
    titleRow.getCell(1).font = { bold:true, size:13, color:{ argb: AZUL } };
    wsRes.addRow([]);

    const hRow = wsRes.addRow(['Estado', 'Nº clientes', '% del total']);
    hRow.eachCell(c => hdrStyle(c));

    [
      ['⚪ Pendiente',     cnt.pendiente,       'pendiente'],
      ['🟢 Realizada',     cnt.realizada,       'realizada'],
      ['🟠 Pospuesta',     cnt.pospuesta,       'pospuesta'],
      ['🔴 No interesado', cnt['no-interesado'],'no-interesado'],
    ].forEach(([label, n, est]) => {
      const row = wsRes.addRow([label, n, pct(n)]);
      row.eachCell(cell => { cell.alignment = { vertical:'middle' }; estadoStyle(cell, est); });
      row.getCell(1).font = { bold:true };
    });

    wsRes.addRow([]);
    const totRow = wsRes.addRow(['TOTAL', total, '100%']);
    totRow.eachCell(c => { c.font = { bold:true }; });
    wsRes.addRow([]);
    wsRes.addRow(['Generado el', new Date().toLocaleDateString('es-ES',
      { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })]);

    // ── Descargar ──────────────────────────────────────────────
    const buffer = await wb.xlsx.writeBuffer();
    const blob   = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href       = url;
    a.download   = `actividad_comercial_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);

    if (btnFull) { btnFull.textContent = orig; btnFull.disabled = false; }
  } catch(e) {
    if (btnFull) { btnFull.textContent = orig; btnFull.disabled = false; }
    alert('❌ Error generando Excel: ' + e.message);
  }
}

async function downloadExcel(tipo) {
  if (!DATA.length) { alert('No hay planning cargado.'); return; }

  const btnPlan = document.getElementById('btn-xls-plan');
  const btnFull = document.getElementById('btn-xls-full');
  const btn = tipo === 'planning' ? btnPlan : btnFull;
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '⏳…'; btn.disabled = true; }

  // Colores ARGB
  const AZUL      = 'FF1A56DB';
  const BLANCO    = 'FFFFFFFF';
  const GRIS_FILA = 'FFF8FAFC';

  const ESTADO_FILL = {
    'realizada':     'FFD1FAE5',
    'pospuesta':     'FFFEF3C7',
    'no-interesado': 'FFFEE2E2',
    'pendiente':     null
  };

  function headerStyle(cell) {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } };
    cell.font = { bold: true, color: { argb: BLANCO }, size: 10 };
    cell.alignment = { vertical: 'middle' };
  }

  function estadoFill(cell, estado) {
    const argb = ESTADO_FILL[estado];
    if (argb) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } };
  }

  function zebraFill(cell, rowIdx) {
    if (rowIdx % 2 === 0) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GRIS_FILA } };
  }

  try {
    // Cargar notas si hace falta
    let notasMap = new Map();
    if (tipo === 'completo') {
      const { data: notasArr } = await sb.from('notas').select('*');
      (notasArr || []).forEach(n => notasMap.set(n.cliente_id, n));
    } else {
      // Para planning también cargamos todos los campos de notas (para la pestaña Actividad Comercial)
      const { data: notasArr } = await sb.from('notas').select('*');
      (notasArr || []).forEach(n => notasMap.set(n.cliente_id, n));
    }

    const wb = new ExcelJS.Workbook();
    wb.creator = 'BilboWeb Planning';
    wb.created = new Date();

    // ── Agrupar por semana ───────────────────────────────────────
    const weeks = new Map();
    DATA.forEach(day => {
      const dt = new Date(day.date);
      const j  = new Date(dt.getFullYear(), 0, 1);
      const w  = Math.ceil(((dt - j) / 86400000 + j.getDay() + 1) / 7);
      const wKey = `${dt.getFullYear()}-S${String(w).padStart(2,'0')}`;
      if (!weeks.has(wKey)) weeks.set(wKey, []);
      weeks.get(wKey).push(day);
    });

    // ── HOJA ACTIVIDAD COMERCIAL (siempre: tanto Semanal como Completo) ──────
    {
      const ws = wb.addWorksheet('Actividad Comercial');
      ws.views = [{ state: 'frozen', ySplit: 1 }];

      const headers = [
        'Fecha plan.','Día','Llegada','Empresa','Municipio','CP',
        'Estado','Fecha visita','Interlocutor','Interés',
        'Problema / Dolor','Servicios','Próximo paso',
        'Seguimiento','Notas libres','Actualizado'
      ];
      ws.columns = [
        {width:12},{width:12},{width:9},{width:38},{width:20},{width:7},
        {width:14},{width:12},{width:20},{width:10},
        {width:30},{width:30},{width:30},{width:12},{width:40},{width:12}
      ];

      const hRow = ws.addRow(headers);
      hRow.height = 20;
      hRow.eachCell(c => headerStyle(c));
      ws.autoFilter = { from: 'A1', to: 'P1' };

      let ri = 0;
      DATA.forEach(day => {
        const dt    = new Date(day.date);
        const fecha = dt.toLocaleDateString('es-ES');
        const diaN  = dt.toLocaleDateString('es-ES', { weekday: 'long' });

        day.clients.forEach(c => {
          const n        = notasMap.get(c.id) || {};
          const estado   = n.estado || c.estado || 'pendiente';
          const servicios = Array.isArray(n.servicios) ? n.servicios.join(', ') : (n.servicios || '');
          const interes  = n.interes ? '⭐'.repeat(n.interes) : '';

          const row = ws.addRow([
            fecha, diaN, c.llegada, c.nombre, c.poblacion, c.cp,
            estado,
            n.fecha_visita      || '',
            n.interlocutor      || '',
            interes,
            (n.dolor            || '').replace(/\n/g,' '),
            servicios,
            (n.proximo_paso     || '').replace(/\n/g,' '),
            n.fecha_seguimiento || '',
            (n.texto            || '').replace(/\n/g,' '),
            n.actualizado_en ? new Date(n.actualizado_en).toLocaleDateString('es-ES') : ''
          ]);
          ri++;

          row.eachCell((cell, col) => {
            cell.alignment = { vertical: 'middle', wrapText: col >= 11 };
            if (col === 7) estadoFill(cell, estado);  // columna Estado
            else zebraFill(cell, ri);
          });
        });
      });
    }

    // ── HOJA RESUMEN ─────────────────────────────────────────────
    {
      const ws = wb.addWorksheet('Resumen');
      ws.columns = [{ width: 22 }, { width: 14 }, { width: 12 }];

      const totalC = DATA.reduce((s, d) => s + d.clients.length, 0);
      const cnt = { pendiente: 0, pospuesta: 0, realizada: 0, 'no-interesado': 0 };
      DATA.forEach(d => d.clients.forEach(c => {
        const e = (notasMap.get(c.id) || {}).estado || 'pendiente';
        if (cnt[e] !== undefined) cnt[e]++; else cnt.pendiente++;
      }));

      const titleRow = ws.addRow(['Resumen de actividad comercial']);
      titleRow.getCell(1).font = { bold: true, size: 13, color: { argb: AZUL } };
      ws.addRow([]);

      const hRow = ws.addRow(['Estado', 'Nº clientes', '% del total']);
      hRow.eachCell(c => headerStyle(c));

      const filas = [
        ['⚪ Pendiente',     cnt.pendiente,        'pendiente'],
        ['🟠 Pospuesta',    cnt.pospuesta,        'pospuesta'],
        ['🟢 Realizada',    cnt.realizada,        'realizada'],
        ['🔴 No interesado',cnt['no-interesado'], 'no-interesado'],
      ];
      filas.forEach(([label, n, estado]) => {
        const pct = totalC > 0 ? ((n / totalC) * 100).toFixed(1) + '%' : '0%';
        const row = ws.addRow([label, n, pct]);
        row.eachCell(cell => {
          estadoFill(cell, estado);
          cell.alignment = { vertical: 'middle' };
        });
        row.getCell(1).font = { bold: true };
      });

      ws.addRow([]);
      const totRow = ws.addRow(['TOTAL', totalC, '100%']);
      totRow.eachCell(c => { c.font = { bold: true }; });
      ws.addRow([]);
      ws.addRow(['Generado el', new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })]);
    }

    // ── HOJAS SEMANALES ─────────────────────────────────────────
    for (const [wKey, days] of weeks) {
      const ws = wb.addWorksheet(wKey);
      ws.views = [{ state: 'frozen', ySplit: 1 }];

      const headers = ['Día','Fecha','Nº','Empresa','Dirección','Municipio','CP','Llegada','Salida','Viaje sig.','Total día','Estado'];
      ws.columns = [
        { key:'dia',     width:13 }, { key:'fecha',  width:12 },
        { key:'num',     width:5  }, { key:'nombre', width:38 },
        { key:'dir',     width:38 }, { key:'mun',    width:22 },
        { key:'cp',      width:8  }, { key:'arr',    width:10 },
        { key:'sal',     width:10 }, { key:'viaje',  width:14 },
        { key:'total',   width:10 }, { key:'estado', width:15 }
      ];

      const hRow = ws.addRow(headers);
      hRow.height = 20;
      hRow.eachCell(c => headerStyle(c));
      ws.autoFilter = { from: 'A1', to: 'L1' };

      let dataRowIdx = 0;
      for (const day of days) {
        const dt      = new Date(day.date);
        const fecha   = dt.toLocaleDateString('es-ES');
        const diaNom  = dt.toLocaleDateString('es-ES', { weekday: 'long' });
        const totalH  = (day.totalMin / 60).toFixed(1) + ' h';

        day.clients.forEach((c, i) => {
          const nextMin   = i < day.clients.length - 1 ? day.clients[i+1].travel : day.retBase;
          const nextLabel = i < day.clients.length - 1 ? `${nextMin} min` : `↩ ${nextMin} min (base)`;
          const nota      = notasMap.get(c.id) || {};
          const estado    = nota.estado || c.estado || 'pendiente';

          const row = ws.addRow([
            i === 0 ? diaNom : '', i === 0 ? fecha : '',
            i + 1, c.nombre, c.direccion, c.poblacion, c.cp,
            c.llegada, c.salida, nextLabel,
            i === 0 ? totalH : '', estado
          ]);
          dataRowIdx++;

          row.eachCell((cell, col) => {
            // Color por estado en columna Estado (12) o fondo cebra
            if (col === 12) estadoFill(cell, estado);
            else zebraFill(cell, dataRowIdx);
            cell.alignment = { vertical: 'middle' };
          });
          // Negrita en primera fila del día
          if (i === 0) {
            row.getCell(1).font = { bold: true };
            row.getCell(11).font = { bold: true };
          }
        });

        // Fila separadora vacía entre días
        ws.addRow([]);
        dataRowIdx++;
      }
    }

    // ── Generar y descargar ──────────────────────────────────────
    const buffer = await wb.xlsx.writeBuffer();
    const blob   = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url    = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href       = url;
    a.download   = tipo === 'planning' ? 'planning_semanal.xlsx' : 'actividad_comercial.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

  } finally {
    if (btn) { btn.textContent = orig; btn.disabled = false; }
  }
}
